apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod" # Change if your ClusterIssuer has a different name
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - fkvr.xyz
    - api.fkvr.xyz
    secretName: frontend-tls-secret
  rules:
    # Frontend
    - host: fkvr.xyz
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: frontend
              port:
                number: 80

    # Backend
    - host: api.fkvr.xyz
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: backend    
              port:
                number: 3500