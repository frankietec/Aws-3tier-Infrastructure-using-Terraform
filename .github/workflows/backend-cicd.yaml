name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-cicd.yaml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: ECR image tag to update in the backend manifest
        required: true
        type: string

permissions:
  contents: write
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ${{ vars.ECR_REPO }}/dev-backend
  IMAGE_NAME: backend
  MANIFEST_FILE: app-manifests/backend-deployment.yaml

jobs:
  build-and-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Log in to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$ECR_REPOSITORY"

      - name: Build and push backend image
        env:
          IMAGE_TAG: ${{ github.run_number }}
        run: |
          docker build -t "$IMAGE_NAME:$IMAGE_TAG" backend
          docker tag "$IMAGE_NAME:$IMAGE_TAG" "$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REPOSITORY:$IMAGE_TAG"

  update-manifest:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update backend image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          sed -i -E "s|^        image: .*|        image: ${ECR_REPOSITORY}:${IMAGE_TAG}|" "$MANIFEST_FILE"
          git diff --exit-code -- "$MANIFEST_FILE" || true

      - name: Commit manifest update
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MANIFEST_FILE"
          git diff --cached --quiet ||
            git commit -m "Update backend image to ${IMAGE_TAG}"
          git push
